<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Palette masters</title>
    <meta
      name="description"
      content="Palette masters — explore Wikimedia masterpieces, extract color palettes, and bring them to life in themed designs."
    />
    <style>
      .swatch-column select {
        min-width: 0;
        width: 100%;
        padding: 2px;
        background: #101814;
        color: #eef2eb;
        border: 1px solid #536451;
        border-radius: 5px;
        font-size: 11px;
      }
      .swatch-column select:disabled {
        opacity: 1;
      }

      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: #eaece7;
        background: #101514;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid #e3bf81;
        outline-offset: 2px;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      a {
        color: inherit;
      }
      img {
        display: block;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      .shell {
        height: 100dvh;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(320px, 375px) minmax(0, 1fr);
      }
      .sidebar {
        min-height: 0;
        overflow: hidden;
        background: #19201d;
        border-right: 1px solid #343f37;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .sidehead {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 16px;
        border-bottom: 1px solid #343f37;
      }
      .brandmark {
        width: 39px;
        height: 39px;
        display: grid;
        place-items: center;
        background: #d1a87a;
        color: #1e241e;
        border-radius: 11px;
        flex-shrink: 0;
      }
      .brand {
        font-size: 14px;
        letter-spacing: -0.3px;
        font-weight: 850;
      }
      .live {
        margin-left: auto;
        font-size: 10px;
        color: #accbb1;
        border: 1px solid #485c4f;
        border-radius: 30px;
        padding: 5px 8px;
      }
      .sideinner {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        overscroll-behavior: contain;
      }
      .eyebrow {
        color: #adbfad;
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        font-weight: 750;
      }
      .palette-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      #btn-shuffle {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 0;
        border: 0;
        background: transparent;
        color: #c5cec2;
        font-size: 11px;
        white-space: nowrap;
      }
      #btn-shuffle svg {
        width: 12px;
        height: 12px;
      }
      #btn-shuffle:hover:not(:disabled) {
        color: #fffaf0;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .swatch-column {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .swatches > .tiny {
        grid-column: 1 / -1;
      }
      .tiny {
        font-size: 11px;
        color: #aeb8ad;
        line-height: 1.5;
      }
      .divider {
        padding-top: 8px;
        border-top: 1px solid #364037;
      }
      .swatches {
        display: grid;
        grid-template-columns: repeat(var(--swatch-count, 5), minmax(0, 1fr));
        gap: 8px;
        margin: 13px 0 5px;
        min-height: 60px;
      }
      .swatch {
        border: 0;
        background: transparent;
        padding: 0;
        color: #c5cec2;
        min-width: 0;
        text-align: center;
      }
      .swatch .pigment {
        position: relative;
        height: 40px;
        border-radius: 8px;
        border: 1px solid #ffffff1c;
        background: linear-gradient(120deg, #26302a, #43564a);
      }
      .swatch code {
        position: absolute;
        bottom: 2px;
        left: 2px;
        padding: 2px;
        border-radius: 4px;
        background: #111827;
        color: #fff;
        font-size: 8px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.35px;
        white-space: nowrap;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .field label {
        color: #afbaaf;
        font-size: 10px;
        letter-spacing: 0.7px;
        text-transform: uppercase;
      }
      .field select,
      .searchbox input {
        width: 100%;
        background: #101713;
        border: 1px solid #415045;
        color: #e4eadf;
        border-radius: 8px;
        padding: 8px;
        font-size: 12px;
        min-width: 0;
      }
      .fieldrow {
        display: flex;
        gap: 10px;
        align-items: end;
      }
      .tabs button.active,
      .template-tabs button.active {
        background: #c99e70;
        color: #18211b;
        font-weight: 750;
      }
      .btn {
        border: 1px solid #4c6152;
        background: transparent;
        color: #e4f0e1;
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 12px;
      }
      .btn:hover {
        background: #2f4035;
      }
      .btn.primary {
        background: #c99e70;
        color: #18211b;
        border-color: #c99e70;
        font-weight: 800;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        background: #111a15;
        border-radius: 9px;
        padding: 4px;
        border: 1px solid #3a4b3d;
      }
      .tabs button {
        padding: 10px;
        border: 0;
        color: #b7c1b7;
        border-radius: 6px;
        background: transparent;
        font-size: 12px;
      }
      .movement-picker {
        display: block;
        width: 100%;
        min-width: 0;
        margin: 0 0 14px;
        padding: 8px;
        border: 1px solid #475548;
        border-radius: 7px;
        background: #27342b;
        color: #eaf0e7;
        font: inherit;
        font-size: 12px;
        text-overflow: ellipsis;
        color-scheme: dark;
      }
      .movement-picker:focus-visible,
      .work:focus-visible {
        outline: 2px solid #edc48e;
        outline-offset: 3px;
      }
      .artists {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 11px 0 14px;
      }
      .artists button {
        border: 1px solid #475548;
        border-radius: 5px;
        background: #27342b;
        color: #d1d9cd;
        padding: 6px 8px;
        font-size: 10px;
      }
      .works {
        position: relative;
        display: grid;
        gap: 9px;
      }
      .artwork-browser {
        --artwork-height: clamp(160px, calc(100dvh - 450px), 400px);
      }
      .artwork-source-switch {
        display: flex;
        gap: 4px;
        padding: 3px;
        margin-bottom: 10px;
        border: 1px solid #475548;
        border-radius: 8px;
      }
      .artwork-source-switch button {
        flex: 1;
        padding: 6px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: #adbfad;
        cursor: pointer;
      }
      .artwork-source-switch button[aria-pressed='true'] {
        background: #39483c;
        color: #fff;
      }
      .artwork-search,
      .artwork-browser .movement-picker {
        width: 100%;
        height: 34px;
        margin: 0 0 10px;
      }
      .artwork-browser .works,
      .searched-artwork {
        height: var(--artwork-height);
      }
      .artwork-browser .works {
        grid-auto-rows: minmax(0, 1fr);
      }
      .artwork-browser .work {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .artwork-browser .work .image-holder,
      .artwork-browser .work .noimage {
        flex: 1;
        min-height: 0;
        height: 0;
        width: 100%;
      }
      .artwork-browser .work img {
        height: 100%;
      }
      .artwork-browser .work > span {
        flex-shrink: 0;
        width: 100%;
      }
      .searched-preview {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0;
        overflow: hidden;
        border: 1px solid #475548;
        border-radius: 8px;
        background: #242d26;
        color: #eaf0e7;
        text-align: left;
        cursor: pointer;
      }
      .searched-preview[aria-pressed='true'] {
        border-color: #edc48e;
      }
      .searched-preview .image-holder,
      .searched-preview .noimage {
        flex: 1;
        min-height: 0;
        width: 100%;
      }
      .searched-preview img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .searched-caption {
        padding: 8px 10px;
        width: 100%;
        flex-shrink: 0;
      }
      .searched-caption strong,
      .searched-caption span,
      .searched-caption small {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .searched-caption strong {
        font-size: 12px;
      }
      .searched-caption span,
      .searched-caption small {
        font-size: 10px;
        color: #adbfad;
      }
      .artwork-empty,
      .searched-preview .noimage {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 16px;
        color: #adbfad;
        font-size: 12px;
        text-align: center;
      }
      .artwork-source-switch button:focus-visible,
      .searched-preview:focus-visible {
        outline: 2px solid #edc48e;
        outline-offset: 2px;
      }
      .painting-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        overflow: hidden;
        border-radius: 8px;
        background: #242d26;
      }
      .painting-overlay > img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .painting-overlay .painting-title {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 28px 14px 14px;
        background: linear-gradient(transparent, #18211de6);
        color: white;
        font-size: 14px;
        line-height: 1.4;
        overflow-wrap: anywhere;
        pointer-events: none;
      }
      .painting-overlay .painting-artist {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        color: #d1d9cd;
      }
      .painting-close {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid #ffffff80;
        border-radius: 50%;
        background: #18211de6;
        color: white;
        cursor: pointer;
      }
      .painting-close:focus-visible {
        outline: 2px solid #edc48e;
        outline-offset: 3px;
      }
      .works.cols-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .works.cols-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .work {
        padding: 0;
        border: 1px solid #3e4c40;
        border-radius: 8px;
        overflow: hidden;
        background: #242d26;
        color: #eaf0e7;
        text-align: left;
        min-width: 0;
      }
      .work:hover {
        border-color: #e2b386;
        transform: translateY(-1px);
      }
      .work.selected {
        border: 2px solid #edc48e;
      }
      .work img {
        width: 100%;
        height: 87px;
        object-fit: cover;
        background: #455348;
      }
      .work .noimage {
        height: 87px;
        display: grid;
        place-items: center;
        background: #35463e;
        font: italic 24px Georgia;
        color: #f6dfbe;
      }
      .work span {
        display: block;
        padding: 7px;
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #searchDialog {
        width: min(640px, calc(100vw - 32px));
        max-height: calc(100dvh - 48px);
        margin: auto;
        padding: 24px;
        overflow-y: auto;
        color: #e7eee5;
        background: #1b2821;
        border: 1px solid #445646;
        border-radius: 14px;
        box-shadow: 0 24px 80px #0008;
      }
      #searchDialog::backdrop {
        background: #0009;
      }
      .search-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .search-heading h2 {
        margin: 0;
        font-size: 20px;
      }
      #searchDialog .searchResults {
        max-height: none;
        overflow: visible;
      }
      #searchDialog .result .image-holder {
        width: 56px;
        height: 56px;
        flex-shrink: 0;
      }
      #searchDialog .result img {
        width: 100%;
        height: 100%;
      }
      #searchDialog .result > span {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .searchbox {
        display: flex;
        gap: 7px;
        margin: 12px 0;
      }
      .searchbox input {
        flex: 1;
        min-width: 0;
      }
      .searchResults {
        display: flex;
        flex-direction: column;
        gap: 5px;
        max-height: 280px;
        overflow: auto;
      }
      .result {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        padding: 9px;
        background: #253229;
        color: #e7eee5;
        border: 1px solid #445646;
        border-radius: 7px;
        text-align: left;
        font-size: 12px;
      }
      .result img {
        width: 42px;
        height: 42px;
        object-fit: cover;
        border-radius: 4px;
        background: #4b5a4a;
      }
      .result small {
        display: block;
        color: #a4b3a6;
        font-size: 10px;
        margin-top: 2px;
      }
      .result:hover {
        border-color: #e0b98c;
      }
      .workspanel {
        border: 1px solid #3f5243;
        border-radius: 8px;
        padding: 10px;
        margin-top: 8px;
      }
      .workspanel button {
        display: block;
        text-align: left;
        width: 100%;
        margin: 4px 0;
      }
      .hidden {
        display: none !important;
      }
      .workspace {
        min-height: 0;
        overflow: hidden;
        background: #121917;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .preview-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 12px;
        min-width: 0;
      }
      #download-theme {
        white-space: nowrap;
      }
      #download-theme:disabled {
        cursor: default;
      }
      .workspace-top {
        flex-shrink: 0;
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        padding: 16px;
        border-bottom: 1px solid #39433c;
      }
      .workspace-top h1 {
        font:
          normal 24px Georgia,
          serif;
        color: #f8f6ee;
        margin: 5px 0 0;
      }
      .template-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px;
        margin: -1px;
        border: 1px solid #4c5b4d;
        border-radius: 9px;
        background: #1b2720;
      }
      .template-tabs button {
        border: 0;
        background: transparent;
        color: #cbd3c8;
        padding: 9px 12px;
        border-radius: 6px;
        font-size: 11px;
      }
      .stage-area {
        padding: 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .preview-scroll {
        width: 100%;
        border: 0;
        display: block;
        flex: 1;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }
      .preview-scroll:focus-visible {
        outline: 2px solid #e3bf81;
        outline-offset: 3px;
      }
      .alert {
        font-size: 11px;
        line-height: 1.6;
        color: #ffdac1;
        border: 1px solid #856e58;
        background: #493a31;
        padding: 10px;
        border-radius: 8px;
      }
      .single-line {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (max-width: 1050px) {
        .shell {
          grid-template-columns: 310px minmax(0, 1fr);
        }
        .stage-area {
          padding: 16px;
        }
      }
      @media (max-width: 760px) {
        .shell {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: 1fr 1fr;
        }
        .sideinner {
          max-height: none;
        }
        .works {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .work span {
          display: none;
        }
      }
      @media (max-width: 460px) {
        .works {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .stage-area {
          padding: 9px;
        }
      }
      .work .image-holder {
        height: 87px;
        min-height: 87px;
      }
      .work .loading-art {
        font-size: 10px;
        padding: 4px;
      }
      .work .loading-art a {
        display: none;
      }
      .work .missing-art {
        height: 87px;
        min-height: 87px;
      }
      .work .missing-art .missing-glyph {
        font-size: 19px;
      }
      .work .missing-art small {
        font-size: 8px;
      }
      .work .missing-art .missing-reason,
      .work .missing-art a {
        display: none;
      }
      .pipeline-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 12px 0;
      }
      .pipeline-fields label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
      }
      .pipeline-fields label[hidden] {
        display: none;
      }
      .pipeline-fields input,
      .pipeline-fields select {
        width: 100%;
        min-width: 0;
        padding: 6px;
        color: inherit;
        background: transparent;
        border: 1px solid #64748b;
        border-radius: 4px;
      }
      .pipeline-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 12px;
        margin: 8px 0;
      }
      .pipeline-actions button,
      .pipeline-actions select {
        padding: 5px;
        color: inherit;
        background: transparent;
        border: 1px solid #64748b;
        border-radius: 4px;
      }
      .advanced-pipeline {
        margin-top: 12px;
      }
      .advanced-pipeline summary {
        cursor: pointer;
      }
      .palette-title {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .palette-help {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .palette-help:hover:not(:disabled) {
        background: #35463e;
      }
      .palette-help:focus-visible {
        outline: 2px solid #edc48e;
        outline-offset: 2px;
      }
      .palette-help:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #palette-error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="shell"></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
