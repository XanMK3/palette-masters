<div class="search-heading">
  <h2 id="searchTitle">Search Wikimedia</h2>
  <button class="btn" id="closeSearch" type="button" aria-label="Close search">Close</button>
</div>
<div id="searchView">
  <form class="searchbox" id="searchForm">
    <input
      id="searchQuery"
      aria-label="Search artist or painting"
      placeholder="Van Gogh, The Starry Night…"
      required
    /><button class="btn primary">Find</button>
  </form>
  <p class="tiny">
    Wikidata entities + Commons images. Some image files may not represent paintings.
  </p>
  <div id="searchResults" class="searchResults">
    <div class="tiny">Search by artist name or painting title.</div>
  </div>
  <div class="workspanel hidden" id="artistWorks"></div>
</div>
